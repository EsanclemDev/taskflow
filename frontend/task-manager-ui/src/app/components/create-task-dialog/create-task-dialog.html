<h2 mat-dialog-title>Nueva tarea</h2>

<mat-dialog-content>
  <p class="dialog-intro">Las tareas nuevas comienzan en Pendiente.</p>

  <form #createForm="ngForm" (ngSubmit)="save()" id="createTaskForm">
    <mat-form-field appearance="outline">
      <mat-label>Título</mat-label>
      <input matInput name="title" [(ngModel)]="form.title"
        required minlength="3" maxlength="100"
        placeholder="¿Qué necesitas hacer?" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Descripción (opcional)</mat-label>
      <textarea matInput name="description" [(ngModel)]="form.description"
        maxlength="500" rows="3" placeholder="Añade los detalles..."></textarea>
    </mat-form-field>

    <div class="dialog-grid">
      <mat-form-field appearance="outline">
        <mat-label>Prioridad</mat-label>
        <mat-select name="priority" [(ngModel)]="form.priority" required>
          <mat-option value="low">Baja</mat-option>
          <mat-option value="medium">Media</mat-option>
          <mat-option value="high">Alta</mat-option>
          <mat-option value="urgent">Urgente</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Categoría</mat-label>
        <mat-select name="category" [(ngModel)]="form.category" required>
          <mat-option value="frontend">Frontend</mat-option>
          <mat-option value="backend">Backend</mat-option>
          <mat-option value="database">Base de datos</mat-option>
          <mat-option value="documentation">Documentación</mat-option>
          <mat-option value="other">Otros</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Fecha límite (opcional)</mat-label>
      <input matInput type="date" name="dueDate" [(ngModel)]="form.dueDate" />
      <mat-hint>La fecha se guarda sin hora</mat-hint>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-flat-button type="submit" form="createTaskForm"
    [disabled]="createForm.invalid">Crear tarea</button>
</mat-dialog-actions>
