
name: Backend Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: .NET 10 Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devuser
          POSTGRES_PASSWORD: devpassword123
          POSTGRES_DB: taskmanager_refresh_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devuser -d taskmanager_refresh_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/TaskManager.Api.Tests/TaskManager.Api.Tests.csproj

      - name: Build
        run: dotnet build backend/TaskManager.Api.Tests/TaskManager.Api.Tests.csproj --no-restore

      - name: Run tests
        run: dotnet test backend/TaskManager.Api.Tests/TaskManager.Api.Tests.csproj --no-build --verbosity normal
