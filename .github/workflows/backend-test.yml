name: Backend Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: .NET 10 Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Base efímera de CI. No es la contraseña del PostgreSQL local ni de producción.
    env:
      TASKFLOW_TEST_POSTGRES: 'Host=localhost;Port=5432;Database=postgres;Username=devuser;Password=ci-taskflow-only-2026'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devuser
          POSTGRES_PASSWORD: ci-taskflow-only-2026
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devuser -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/TaskManager.Api.Tests/TaskManager.Api.Tests.csproj

      - name: Build
        run: dotnet build backend/TaskManager.Api.Tests/TaskManager.Api.Tests.csproj --no-restore

      - name: Run tests
        run: dotnet test backend/TaskManager.Api.Tests/TaskManager.Api.Tests.csproj --no-build --verbosity normal
