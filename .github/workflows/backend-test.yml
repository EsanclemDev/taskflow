
name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: .NET 10 Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/TaskManager.Api.Tests/TaskManager.Api.Tests.csproj

      - name: Build
        run: dotnet build backend/TaskManager.Api.Tests/TaskManager.Api.Tests.csproj --no-restore

      - name: Run tests
        run: dotnet test backend/TaskManager.Api.Tests/TaskManager.Api.Tests.csproj --no-build --verbosity normal
